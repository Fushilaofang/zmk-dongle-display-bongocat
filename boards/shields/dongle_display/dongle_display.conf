CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y

# LVGL Configuration for Canvas Drawing
CONFIG_LV_USE_DRAW=y
CONFIG_LV_DRAW_SW=y
CONFIG_LV_USE_CANVAS=y

# Enable LVGL drawing functions
CONFIG_LV_DRAW_SW_COMPLEX=y
CONFIG_LV_DRAW_SW_SHADOW=y
CONFIG_LV_DRAW_SW_BORDER=y
CONFIG_LV_DRAW_SW_BOX_SHADOW=y
CONFIG_LV_DRAW_SW_FILL=y
CONFIG_LV_DRAW_SW_MASK=y

# Enable font and text rendering
CONFIG_LV_USE_FONT_PLACEHOLDER=y
CONFIG_LV_FONT_DEFAULT_MONTSERRAT_14=y
CONFIG_LV_FONT_UNSCII_8=y

# Enable widgets and features needed
CONFIG_LV_USE_LABEL=y
CONFIG_LV_USE_LINE=y
CONFIG_LV_USE_RECT=y

# Memory and performance settings
CONFIG_LV_MEM_CUSTOM=n
CONFIG_LV_USE_LOG=n
